name: Code Test

# racecar fork-testbed patch. Changes from upstream:
#   1. workflow_dispatch with a `leg` input, so racecar can trigger a run and
#      choose baseline vs instrumented. Upstream only fires on push/PR with a
#      paths filter, which racecar cannot drive.
#   2. actions/checkout -> crashappsec/action-checkout, which wraps checkout and
#      setup-chalk-action together. `chalk:` is the single variable separating
#      the two arms, and `profile:` selects the observables profile.
#   3. permissions: id-token: write for the action's OIDC connect. Declaring the
#      block zeroes every unlisted scope, so the upstream scopes are restated.
#   4. A fail-closed assertion on the instrumented arm.
# The test COMMAND is byte-identical to upstream.

on:
  workflow_dispatch:
    inputs:
      leg:
        description: "baseline (uninstrumented) or instrumented (under chalk/curiosity)"
        type: choice
        options: [instrumented, baseline]
        default: instrumented
      profile:
        description: "CrashOverride chalk profile"
        type: string
        default: curiosity-tests-racecar
      racecar_run:
        description: "racecar correlation token, echoed into the run name"
        type: string
        default: ""
  push:
    branches:
      - master
    paths:
      - 'v2rayN/ServiceLib/**'
      - 'v2rayN/ServiceLib.UdpTest/**'
      - 'v2rayN/ServiceLib.Tests/**'
      - 'v2rayN/Directory.Build.*'
      - 'v2rayN/Directory.Packages.props'
      - 'global.json'
      - '.github/workflows/test.yml'
  pull_request:
    branches:
      - master
    paths:
      - 'v2rayN/ServiceLib/**'
      - 'v2rayN/ServiceLib.UdpTest/**'
      - 'v2rayN/ServiceLib.Tests/**'
      - 'v2rayN/Directory.Build.*'
      - 'v2rayN/Directory.Packages.props'
      - 'global.json'
      - '.github/workflows/test.yml'

run-name: "Code Test ${{ inputs.leg || 'push' }} ${{ inputs.racecar_run }}"

permissions:
  contents: read
  checks: write
  pull-requests: write
  id-token: write

env:
  # The one variable that separates the arms. On baseline, action-checkout skips
  # its Set up Chalk step entirely.
  CHALK_ON: ${{ inputs.leg == 'instrumented' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: crashappsec/action-checkout@e9ff46a65f6403d9d88b87d248c3dfa41550ec75
      with:
        chalk: ${{ env.CHALK_ON }}
        profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
        # Default is best-effort; a silently-uninstrumented run is a corrupt data
        # point rather than a degraded one, so fail closed.
        observables_continue_on_error: false
        # Upstream used actions/checkout, which does not fetch LFS. Keep the tree
        # identical to what upstream CI builds.
        lfs: false

    # Assert on the host-server socket, NOT on LD_PRELOAD: co-monitor's loader
    # clears LD_PRELOAD once it has injected, so an empty LD_PRELOAD is what
    # SUCCESS looks like from inside the shell. co-hostd daemonizes, so pgrep is
    # no good either. Socket existence is what curiosity's own CI gates on.
    - name: Assert instrumentation is live
      if: env.CHALK_ON == 'true'
      run: |
        test -n "${CURIOSITY_ROOT:-}" || { echo "::error::CURIOSITY_ROOT unset - observables never installed"; exit 1; }
        test -S "${CURIOSITY_SOCKET_NAME:?socket name unset}" || { echo "::error::co-hostd socket absent"; exit 1; }

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.x'
        dotnet-quality: 'ga'

    - name: Test Code
      run: dotnet test --project ./v2rayN/ServiceLib.Tests -c Release --results-directory ./TestResults -- --report-trx

    - name: Comment PR with results
      if: always()
      uses: EnricoMi/publish-unit-test-result-action@v2
      with:
        files: ./TestResults/*.trx
        comment_mode: failures
